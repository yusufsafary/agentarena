kind = "web"
previewPath = "/"
title = "AgentArena.id"
version = "1.0.0"
id = "artifacts/agentarena"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20942

[services.development]
run = "pnpm --filter @workspace/agentarena run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/agentarena", "run", "build" ]
serve = "static"
publicDir = "artifacts/agentarena/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20942"
BASE_PATH = "/"
